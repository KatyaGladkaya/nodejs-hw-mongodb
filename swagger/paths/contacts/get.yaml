tags:
  - Контакти
summary: Отримати всі контакти
operationId: getAllContacts
description: Повертає список контактів з пагінацією та сортуванням
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    description: Номер сторінки (для пагінації)
    required: false
    schema:
      type: integer
      default: 1

  - name: perPage
    in: query
    description: Кількість контактів на сторінці
    required: false
    schema:
      type: integer
      default: 10

  - name: sortBy
    in: query
    description: Поле для сортування (наприклад, name або email)
    required: false
    schema:
      type: string
      enum: [name, email, phone, createdAt]

  - name: sortOrder
    in: query
    description: Напрямок сортування
    required: false
    schema:
      type: string
      enum: [asc, desc]

responses:
  responses:
  '200':
    description: Список контактів
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: array
              items:
                $ref: '../../components/schemas/ContactInput.yaml'
            total:
              type: integer
              example: 100
            page:
              type: integer
              example: 1
            limit:
              type: integer
              example: 10

  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../components/responses/NotFound.yaml'
