tags:
  - Контакти
summary: Отримати всі контакти
description: Повертає список контактів з фільтрацією, сортуванням і пагінацією
operationId: getAllContacts
security:
  - bearerAuth: []
parameters:
  - name: page
    in: query
    required: false
    schema:
      type: integer
    description: Номер сторінки
  - name: limit
    in: query
    required: false
    schema:
      type: integer
    description: Кількість контактів на сторінці
  - name: sortBy
    in: query
    required: false
    schema:
      type: string
      enum: [name, email, createdAt]
    description: Поле сортування
  - name: order
    in: query
    required: false
    schema:
      type: string
      enum: [asc, desc]
    description: Напрямок сортування
  - name: contactType
    in: query
    required: false
    schema:
      type: string
    description: Тип контакту
  - name: isFavourite
    in: query
    required: false
    schema:
      type: boolean
    description: Фільтрація за улюбленими

responses:
  '200':
    description: Список контактів
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Список контактів отримано успішно
            data:
              type: object
              properties:
                total:
                  type: integer
                  example: 100
                page:
                  type: integer
                  example: 1
                limit:
                  type: integer
                  example: 10
                contacts:
                  type: array
                  items:
                    $ref: '../../components/schemas/Contact.yaml'

  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../components/responses/NotFound.yaml'
