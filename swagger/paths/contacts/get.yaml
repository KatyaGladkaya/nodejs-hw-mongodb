get:
  tags:
    - Contacts
  summary: Отримати контакт за ID
  operationId: getContactById
  description: Повертає контакт із бази даних за унікальним ідентифікатором.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
      description: Унікальний ідентифікатор контакту
  responses:
    '200':
      description: Успішне отримання контакту
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Контакт не знайдено
      content:
        application/json:
          schema:
            $ref: '../../../components/responses/NotFound.yaml'
