post:
  tags:
    - Контакти
  summary: Створити новий контакт
  operationId: createContact
  description: Додає новий контакт до списку.
  security:
    - bearerAuth: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ContactInput.yaml'
  responses:
    '201':
      description: Контакт успішно створено
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/Contact.yaml'
    '400':
      description: Невірні дані
