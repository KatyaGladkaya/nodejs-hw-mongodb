tags:
  - Контакти
summary: Створити новий контакт
operationId: createContact
description: Додає новий контакт до списку.
security:
  - bearerAuth: []
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Ivan Petrenko
          email:
            type: string
            format: email
            example: ivan@example.com
          phoneNumber:
            type: string
            example: +380931112233
          contactType:
            type: string
            example: business
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
        required:
          - name
          - phoneNumber
          - contactType
responses:
  '201':
    description: Контакт успішно створено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 201
            message:
              type: string
              example: Successfully created a contact!
            data:
              $ref: '../../components/schemas/ContactInput.yaml'
  '400':
    description: Контакт не додано
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Something went wrong
