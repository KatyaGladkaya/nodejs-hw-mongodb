tags:
  - Контакти
summary: Отримати контакт за ID
operationId: getContactById
description: Повертає контакт за унікальним ідентифікатором.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Унікальний ідентифікатор контакту
responses:
  '200':
    description: Успішне отримання контакту
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Контакт знайдено
            data:
              type: object
              properties:
                contact:
                  $ref: '../../../components/schemas/ContactInput.yaml'
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: error
            message:
              type: string
              example: Контакт не знайдено
            contact:
              $ref: '../../../components/responses/NotFound.yaml'
