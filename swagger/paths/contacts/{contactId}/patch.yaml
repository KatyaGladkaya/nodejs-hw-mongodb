tags:
  - Контакти
summary: Оновити контакт
operationId: updateContact
description: Оновлює дані існуючого контакту.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Ідентифікатор контакту
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Ivan Petrenko
          email:
            type: string
            format: email
          phoneNumber:
            type: string
          contactType:
            type: string
          isFavourite:
            type: boolean
            example: false
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Успішне оновлення контакту
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully patched a contact!
            data:
              type: object
              properties:
                contact:
                  $ref: '../../../components/schemas/ContactInput.yaml'
  '400':
    description: Неправильний запит
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 400
            message:
              type: string
              example: Something went wrong
            data:
              type: string
              example: id is not a valid
