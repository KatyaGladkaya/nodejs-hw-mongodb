tags:
  - Контакти
summary: Оновити контакт
operationId: updateContact
description: Оновлює дані існуючого контакту.
security:
  - bearerAuth: []
parameters:
  - name: contactId
    in: path
    required: true
    schema:
      type: string
    description: Ідентифікатор контакту
requestBody:
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            type: string
            example: Ivan Petrenko
          email:
            type: string
            format: email
          phone:
            type: string
          contactType:
            type: string
          photo:
            type: string
            format: binary
responses:
  '200':
    description: Успішне оновлення контакту
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: string
              example: success
            message:
              type: string
              example: Контакт оновлено
            data:
              type: object
              properties:
                contact:
                  $ref: '../../../components/schemas/ContactInput.yaml'
  '404':
    description: Контакт не знайдено
    content:
      application/json:
        schema:
          $ref: '../../../components/responses/NotFound.yaml'
