patch:
  tags:
    - Контакти
  summary: Оновити контакт
  operationId: updateContact
  description: Оновлює дані існуючого контакту.
  security:
    - bearerAuth: []
  parameters:
    - name: contactId
      in: path
      required: true
      schema:
        type: string
      description: Ідентифікатор контакту
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../../components/schemas/ContactInput.yaml'
  responses:
    '200':
      description: Контакт оновлено
      content:
        application/json:
          schema:
            $ref: '../../../components/schemas/Contact.yaml'
    '404':
      description: Контакт не знайдено
